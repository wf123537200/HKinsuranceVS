# policy-vector.com nginx vhost template.
#
# This file is a TEMPLATE for reference / disaster recovery. The live file
# on the server is at /etc/nginx/conf.d/policy-vector.com.conf and is managed
# by `certbot --nginx`. Do not deploy this directly -- certbot will rewrite
# the listen directives to add ssl_certificate/options-ssl-nginx.conf etc.
#
# To re-bootstrap on a fresh server:
#   1. Copy this file to /etc/nginx/conf.d/policy-vector.com.conf
#   2. sudo certbot --nginx -d policy-vector.com -d www.policy-vector.com
#      (certbot rewrites the listen 80 server block to add 443 + SSL,
#       and inserts a 301 redirect from http->https.)

server {
    listen 80;
    listen [::]:80;
    server_name policy-vector.com www.policy-vector.com;

    location / {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";

        # Next.js SSR can be slow on cold-start; raise timeouts.
        proxy_connect_timeout 10s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
        proxy_buffering       off;

        # Compare AI payloads can be larger than default 1m.
        client_max_body_size 16m;
    }
}
